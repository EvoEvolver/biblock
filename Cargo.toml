[package]
name = "biblock-cli"
version = "0.12.0"
edition = "2024"
description = "A provider-neutral BibTeX reconciliation CLI with a reviewable JSON lockfile"
license = "MIT"
repository = "https://github.com/EvoEvolver/biblock"

[[bin]]
name = "biblock"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
percent-encoding = "2.3"
quick-xml = "0.38"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_bibtex = "0.7"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.21"
hostname = "0.4"
tiny_http = "0.12"
webbrowser = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
strip = true
lto = "thin"
